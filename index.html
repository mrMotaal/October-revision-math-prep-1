<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>October Revision Math Prep 1</title>
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.95);
            --text-main: #0c4a6e;
            --text-muted: #0284c7;
            --btn-bg: #38bdf8;
            --btn-shadow: #0284c7;
            --btn-hover: #7dd3fc;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media print {
            body { background: white; padding: 0; }
            .btn-toggle, .solution-box { display: none !important; }
            .question-card { break-inside: avoid; box-shadow: none; border: 1px solid #cbd5e1; margin-bottom: 20px; background: white; }
            .student-workspace { display: flex !important; }
            header { box-shadow: none; border: 2px solid #0284c7; margin-bottom: 1.5rem; }
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 1.5rem 3rem;
            border-radius: 30px;
            border: 2px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.1), inset 0 2px 10px rgba(255,255,255,1);
            width: 100%;
            max-width: 840px;
        }

        header h1 {
            margin: 0;
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 2px dashed #bae6fd;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .info-field {
            flex: 1;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-line {
            flex: 1;
            border-bottom: 2px dotted #0284c7;
            height: 1.2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0369a1;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            padding-left: 1rem;
            border-left: 6px solid var(--btn-bg);
            border-radius: 4px;
        }

        .question-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 2.2rem 2rem 1.8rem 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05), inset 0 2px 8px rgba(255,255,255,0.8);
            position: relative;
        }

        .q-number {
            position: absolute;
            top: -15px;
            left: -15px;
            background: var(--btn-bg);
            color: white;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 1rem 0 1.5rem 0;
        }

        .option-item {
            background: rgba(240, 249, 255, 0.9);
            border: 2px solid #bae6fd;
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-questions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 1rem 0;
            padding-left: 1rem;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .figure-box {
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid #e0f2fe;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 1.15rem;
            text-align: center;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th, .data-table td {
            border: 2px solid #bae6fd;
            padding: 10px;
            font-weight: 700;
        }

        .data-table th {
            background: #e0f2fe;
            color: #0369a1;
        }

        .student-workspace {
            margin: 1.8rem 0 1.2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .writing-line {
            width: 100%;
            height: 1px;
            border-bottom: 2px dashed #93c5fd;
        }

        .btn-toggle {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1.05rem;
            font-weight: 800;
            font-family: inherit;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--btn-shadow);
            transition: all 0.1s ease;
            outline: none;
            margin-top: 0.5rem;
        }

        .btn-toggle:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 var(--btn-shadow);
        }

        .btn-toggle:hover {
            background: var(--btn-hover);
        }

        .solution-box {
            margin-top: 1.2rem;
            padding: 1.2rem;
            background: rgba(240, 249, 255, 0.95);
            border-radius: 16px;
            border: 2px dashed #38bdf8;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0369a1;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>October Revision Math Prep 1</h1>
        <div class="student-info">
            <div class="info-field"><span>Name:</span><div class="info-line"></div></div>
            <div class="info-field" style="max-width: 260px;"><span>Date:</span><div class="info-line"></div></div>
        </div>
    </header>

    <div class="container" id="app"></div>

    <script>
        const revisionData = [
            {
                section: "Unit 1: Ratio & Proportion",
                questions: [
                    {
                        q: "If two ratios are equal, then the product of the extremes = ................",
                        a: "the product of the means."
                    },
                    {
                        q: "Which of the following pairs of ratios are NOT proportional?",
                        options: ["(a) $\\frac{2}{5}, \\frac{12}{30}$", "(b) $\\frac{8}{10}, \\frac{12}{15}$", "(c) $\\frac{7}{8}, \\frac{35}{40}$", "(d) $\\frac{3}{4}, \\frac{12}{18}$"],
                        a: "(d) $\\frac{3}{4}, \\frac{12}{18}$ because $\\frac{12}{18} = \\frac{2}{3} \\neq \\frac{3}{4}$."
                    },
                    {
                        q: "Ibrahim can run a distance of 60 meters in 20 seconds. If he continues at the same speed, which proportion can you use to find the time ($X$) in seconds he needs to cover a distance of 360 meters?",
                        options: ["(a) $\\frac{X}{360} = \\frac{60}{20}$", "(b) $\\frac{360}{X} = \\frac{60}{20}$", "(c) $\\frac{360}{60} = \\frac{20}{X}$", "(d) $\\frac{360}{20} = \\frac{60}{X}$"],
                        a: "(b) $\\frac{360}{X} = \\frac{60}{20}$"
                    },
                    {
                        q: "$\\frac{49}{14} =$ ................",
                        options: ["(a) $\\frac{21}{4}$", "(b) $\\frac{49}{2}$", "(c) $\\frac{7}{4}$", "(d) $\\frac{14}{4}$"],
                        a: "(d) $\\frac{14}{4}$ (Both simplify to $\\frac{7}{2}$)."
                    },
                    {
                        q: "Which of the relationships shown below represents a proportion?",
                        figure: `<div class="figure-box">
                            <svg width="130" height="130" viewBox="0 0 120 120"><line x1="20" y1="100" x2="110" y2="100" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="100" x2="20" y2="10" stroke="#e11d48" stroke-width="2"/><path d="M 20 100 Q 60 95 95 20" fill="none" stroke="#e11d48" stroke-width="2.5"/><text x="55" y="116" font-size="13" font-weight="bold">(a)</text></svg>
                            <svg width="130" height="130" viewBox="0 0 120 120"><line x1="20" y1="100" x2="110" y2="100" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="100" x2="20" y2="10" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="100" x2="95" y2="25" stroke="#e11d48" stroke-width="2.5"/><text x="55" y="116" font-size="13" font-weight="bold">(b)</text></svg>
                            <svg width="130" height="130" viewBox="0 0 120 120"><line x1="20" y1="100" x2="110" y2="100" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="100" x2="20" y2="10" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="75" x2="95" y2="25" stroke="#e11d48" stroke-width="2.5"/><text x="55" y="116" font-size="13" font-weight="bold">(c)</text></svg>
                            <svg width="130" height="130" viewBox="0 0 120 120"><line x1="20" y1="100" x2="110" y2="100" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="100" x2="20" y2="10" stroke="#e11d48" stroke-width="2"/><line x1="20" y1="30" x2="95" y2="85" stroke="#e11d48" stroke-width="2.5"/><text x="55" y="116" font-size="13" font-weight="bold">(d)</text></svg>
                        </div>`,
                        options: ["(a)", "(b)", "(c)", "(d)"],
                        a: "(b) Because it is a straight line passing through the origin point $(0,0)$."
                    },
                    {
                        q: "If $\\frac{8}{x} = 0.5$, what is the value of $x$?",
                        options: ["(a) $4$", "(b) $8$", "(c) $16$", "(d) $40$"],
                        a: "(c) $16$ because $x = \\frac{8}{0.5} = 16$."
                    },
                    {
                        q: "If $a : 27 = 4 : 3$, what is the value of $a$?",
                        options: ["(a) $\\frac{4}{9}$", "(b) $36$", "(c) $\\frac{81}{4}$", "(d) $27$"],
                        a: "(b) $36$ because $a = \\frac{4 \\times 27}{3} = 36$."
                    },
                    {
                        q: "If $\\frac{x}{4} = \\frac{12}{8}$, what is the value of $2x$?",
                        options: ["(a) $3$", "(b) $6$", "(c) $12$", "(d) $18$"],
                        a: "(c) $12$ because $x = \\frac{4 \\times 12}{8} = 6$, so $2x = 2 \\times 6 = 12$."
                    },
                    {
                        q: "If $\\frac{2}{5} = \\frac{x}{15}$, what is the value of $x + 3$?",
                        options: ["(a) $3$", "(b) $6$", "(c) $8$", "(d) $9$"],
                        a: "(d) $9$ because $x = \\frac{2 \\times 15}{5} = 6$, so $x + 3 = 6 + 3 = 9$."
                    },
                    {
                        q: "If $\\frac{18}{24} = \\frac{3}{a - 1}$, what is the value of $a$?",
                        options: ["(a) $6$", "(b) $4$", "(c) $5$", "(d) $3$"],
                        a: "(c) $5$ because $a - 1 = \\frac{3 \\times 24}{18} = 4 \\implies a = 5$."
                    },
                    {
                        q: "Two pieces of cheese of the same kind contain 240 calories. How many calories are there in 7 pieces of cheese of the same kind?",
                        options: ["(a) $127$", "(b) $120$", "(c) $840$", "(d) $1,680$"],
                        a: "(c) $840$ calories because $\\frac{240 \\times 7}{2} = 840$."
                    },
                    {
                        q: "A car consumes 2 liters of fuel to travel 22 km. How many liters are needed to travel 110 km, if it maintains the same rate?",
                        options: ["(a) $5$", "(b) $10$", "(c) $130$", "(d) $1,210$"],
                        a: "(b) $10$ liters because $x = \\frac{2 \\times 110}{22} = 10$."
                    },
                    {
                        q: "Solve the following proportions:<div class='sub-questions'><span>(1) $\\frac{15}{x} = \\frac{45}{60}$</span><span>(2) $\\frac{18}{x + 2} = \\frac{9}{12}$</span></div>",
                        a: "(1) $x = \\frac{15 \\times 60}{45} = 20$ <br> (2) $x + 2 = \\frac{18 \\times 12}{9} = 24 \\implies x = 22$"
                    },
                    {
                        q: "If $15x = 20y$, then:<div class='sub-questions'><span>(1) $x : y =$ ................</span><span>(2) $y : x =$ ................</span></div>",
                        a: "(1) $x : y = \\frac{20}{15} = 4 : 3$ <br> (2) $y : x = 3 : 4$"
                    },
                    {
                        q: "The following table shows how much Ibrahim saves within a certain number of months. Are the amounts saved proportional to the number of months?",
                        figure: `<table class="data-table">
                            <tr><th>Amount (LE)</th><td>300</td><td>600</td><td>900</td><td>1,200</td></tr>
                            <tr><th>Number of Months</th><td>2</td><td>4</td><td>6</td><td>8</td></tr>
                        </table>`,
                        a: "Yes, they are proportional because $\\frac{300}{2} = \\frac{600}{4} = \\frac{900}{6} = \\frac{1200}{8} = 150$."
                    }
                ]
            },
            {
                section: "Unit 1: Applications of Ratio & Proportion (Drawing Scale, Division & Percentage)",
                questions: [
                    {
                        q: "Which of the following scale drawings represents a minimization?",
                        options: ["(a) $200,000 : 1$", "(b) $1 : 700$", "(c) $50 : 1$", "(d) $700 : 1$"],
                        a: "(b) $1 : 700$ because the drawing length is less than the real length."
                    },
                    {
                        q: "Which of the following scales represents a magnification?",
                        options: ["(a) $1 : 300$", "(b) $300 : 1$", "(c) $1 : 30$", "(d) $1 : 50,000$"],
                        a: "(b) $300 : 1$ because the first term is greater than the second term."
                    },
                    {
                        q: "A magnifying glass was used to magnify an insect from $0.7\\text{ mm}$ to $14\\text{ cm}$. Find the magnification ratio.",
                        a: "Drawing : Real $= 14\\text{ cm} : 0.7\\text{ mm} = 140\\text{ mm} : 0.7\\text{ mm} = 200 : 1$."
                    },
                    {
                        q: "If the length in the drawing is $14\\text{ mm}$ and the real length is $700\\text{ meters}$, what is the scale drawing?",
                        options: ["(a) $1 : 50,000$", "(b) $1 : 5,000$", "(c) $1 : 500$", "(d) $1 : 50$"],
                        a: "(a) $1 : 50,000$ because $14\\text{ mm} : 700,000\\text{ mm} = 1 : 50,000$."
                    },
                    {
                        q: "If the scale drawing of a map is shown below and the distance between two cities on the map is $4\\text{ cm}$, what is the real distance between them?",
                        figure: `<div class="figure-box"><svg width="340" height="50" viewBox="0 0 340 50"><rect x="20" y="20" width="50" height="10" fill="#0284c7"/><rect x="70" y="20" width="50" height="10" fill="white" stroke="#0284c7"/><rect x="120" y="20" width="50" height="10" fill="#0284c7"/><rect x="170" y="20" width="50" height="10" fill="white" stroke="#0284c7"/><rect x="220" y="20" width="50" height="10" fill="#0284c7"/><text x="16" y="15" font-size="12" font-weight="bold">0</text><text x="63" y="15" font-size="12" font-weight="bold">20</text><text x="113" y="15" font-size="12" font-weight="bold">40</text><text x="163" y="15" font-size="12" font-weight="bold">60</text><text x="213" y="15" font-size="12" font-weight="bold">80</text><text x="260" y="15" font-size="12" font-weight="bold">100 km</text></svg></div>`,
                        options: ["(a) $8\\text{ km}$", "(b) $80\\text{ km}$", "(c) $800\\text{ km}$", "(d) $20\\text{ km}$"],
                        a: "(b) $80\\text{ km}$ because $1\\text{ cm}$ represents $20\\text{ km}$, so $4 \\times 20 = 80\\text{ km}$."
                    },
                    {
                        q: "A map is drawn with a scale drawing given in the figure below. If the distance between two cities on the map is $2.8\\text{ cm}$, find the real length between them in kilometers.",
                        figure: `<div class="figure-box"><svg width="320" height="50" viewBox="0 0 320 50"><rect x="20" y="20" width="55" height="10" fill="#0284c7"/><rect x="75" y="20" width="55" height="10" fill="white" stroke="#0284c7"/><rect x="130" y="20" width="55" height="10" fill="#0284c7"/><rect x="185" y="20" width="55" height="10" fill="white" stroke="#0284c7"/><text x="16" y="15" font-size="12" font-weight="bold">0</text><text x="68" y="15" font-size="12" font-weight="bold">50</text><text x="118" y="15" font-size="12" font-weight="bold">100</text><text x="173" y="15" font-size="12" font-weight="bold">150</text><text x="228" y="15" font-size="12" font-weight="bold">200 km</text></svg></div>`,
                        a: "Here $1\\text{ cm}$ represents $50\\text{ km}$. Real distance $= 2.8 \\times 50 = 140\\text{ km}$."
                    },
                    {
                        q: "If the scale drawing is $1 : 1,000$ and the real length is $25\\text{ meters}$, what is the length in the drawing in centimeters?",
                        options: ["(a) $0.025$", "(b) $0.25$", "(c) $2.5$", "(d) $25$"],
                        a: "(c) $2.5\\text{ cm}$ because $25\\text{ m} = 2500\\text{ cm}$, and $\\frac{2500}{1000} = 2.5\\text{ cm}$."
                    },
                    {
                        q: "If the length of a road on a map drawn to a scale of $1 : 900,000$ is $11\\text{ cm}$, what is the real length of the road in kilometers?",
                        options: ["(a) $9$", "(b) $5$", "(c) $90$", "(d) $99$"],
                        a: "(d) $99\\text{ km}$ because $\\frac{11 \\times 900,000}{100,000} = 99\\text{ km}$."
                    },
                    {
                        q: "The opposite figure represents a room model, where every $1\\text{ cm}$ in the model represents $1.3\\text{ m}$ in reality. What is the room's real area?",
                        figure: `<div class="figure-box"><svg width="220" height="160" viewBox="0 0 220 160"><rect x="40" y="25" width="140" height="110" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/><text x="95" y="18" font-size="14" font-weight="bold">4 cm</text><text x="2" y="85" font-size="14" font-weight="bold">3.2 cm</text></svg></div>`,
                        a: "Real length $= 4 \\times 1.3 = 5.2\\text{ m}$. Real width $= 3.2 \\times 1.3 = 4.16\\text{ m}$. <br> Real Area $= 5.2 \\times 4.16 = 21.632\\text{ m}^2$."
                    },
                    {
                        q: "An amount of $300\\text{ LE}$ is divided between two persons in the ratio $1 : 3$. What is the share of the smaller person?",
                        options: ["(a) $75$", "(b) $100$", "(c) $150$", "(d) $200$"],
                        a: "(b) $100$ (Note: If the sum of parts in the video table is taken as 3, $\\frac{300}{3} = 100$; by exact sum $1+3=4$, $\\frac{300}{4} = 75$ (a))."
                    },
                    {
                        q: "The ratio among the lengths of the sides of a triangle is $2 : 4 : 5$. If the length of the smallest side is $20\\text{ cm}$, what is the length of the largest side?",
                        options: ["(a) $10\\text{ cm}$", "(b) $20\\text{ cm}$", "(c) $30\\text{ cm}$", "(d) $50\\text{ cm}$"],
                        a: "(d) $50\\text{ cm}$ because $\\frac{20 \\times 5}{2} = 50\\text{ cm}$."
                    },
                    {
                        q: "Divide $180\\text{ LE}$ among three people in the ratio $3 : 2 : 4$. Find each person's share.",
                        a: "Sum of ratio parts $= 3 + 2 + 4 = 9$. <br> First share $= \\frac{3 \\times 180}{9} = 60\\text{ LE}$, Second share $= \\frac{2 \\times 180}{9} = 40\\text{ LE}$, Third share $= \\frac{4 \\times 180}{9} = 80\\text{ LE}$."
                    },
                    {
                        q: "The ratio between two numbers is $5 : 3$. If the difference between them is $16$, what is the larger number?",
                        options: ["(a) $10$", "(b) $40$", "(c) $24$", "(d) $6$"],
                        a: "(b) $40$ because Difference in ratio $= 5 - 3 = 2$, so Larger number $= \\frac{5 \\times 16}{2} = 40$."
                    },
                    {
                        q: "Shaimaa and Fatima invested in a project. Shaimaa paid $25,000\\text{ LE}$ and Fatima paid $35,000\\text{ LE}$. If the total profit is $48,000\\text{ LE}$, what is Fatima's share of the profit?",
                        options: ["(a) $800$", "(b) $20,000$", "(c) $28,000$", "(d) $8,000$"],
                        a: "(c) $28,000\\text{ LE}$ because Ratio $= 25,000 : 35,000 = 5 : 7$ (Sum $= 12$). Fatima's share $= \\frac{7 \\times 48,000}{12} = 28,000\\text{ LE}$."
                    },
                    {
                        q: "If the price of an item is reduced from $2,700\\text{ LE}$ to $2,484\\text{ LE}$, what is the discount rate?",
                        options: ["(a) $8\\%$", "(b) $18\\%$", "(c) $10\\%$", "(d) $6\\%$"],
                        a: "(a) $8\\%$ because Discount $= 2700 - 2484 = 216\\text{ LE}$, Rate $= \\frac{216}{2700} \\times 100 = 8\\%$."
                    },
                    {
                        q: "If the price of a calculator increased from $700\\text{ LE}$ to $840\\text{ LE}$, what is the rate of increase?",
                        options: ["(a) $10\\%$", "(b) $15\\%$", "(c) $18\\%$", "(d) $20\\%$"],
                        a: "(d) $20\\%$ because Increase $= 840 - 700 = 140\\text{ LE}$, Rate $= \\frac{140}{700} \\times 100 = 20\\%$."
                    },
                    {
                        q: "If the price of a chair is $2,500\\text{ LE}$ and there is a $15\\%$ discount rate, what is the price of the chair after the discount?",
                        options: ["(a) $2,875\\text{ LE}$", "(b) $375\\text{ LE}$", "(c) $2,485\\text{ LE}$", "(d) $2,125\\text{ LE}$"],
                        a: "(d) $2,125\\text{ LE}$ because $\\frac{85 \\times 2500}{100} = 2,125\\text{ LE}$."
                    },
                    {
                        q: "Hazem bought a pair of shoes for $450\\text{ LE}$ after a discount rate of $10\\%$. Find the original price of the shoes.",
                        a: "After discount $= 90\\%$. Original price $= \\frac{100 \\times 450}{90} = 500\\text{ LE}$."
                    },
                    {
                        q: "In a restaurant, Adam ordered a lunch with a price of $130\\text{ LE}$, and a $14\\%$ tax is added to the price of the meal. What is the value of the tax and the total amount Adam will pay?",

        const appContainer = document.getElementById('app');
        let globalQuestionCounter = 1;

        const generateWorkspace = () => {
            let lines = '';
            for (let i = 0; i < 8; i++) {
                lines += '<div class="writing-line"></div>';
            }
            return `<div class="student-workspace">${lines}</div>`;
        };

        revisionData.forEach(sectionData => {
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-title';
            sectionHeader.textContent = sectionData.section;
            appContainer.appendChild(sectionHeader);

            sectionData.questions.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                let optionsHTML = '';
                if (item.options && item.options.length > 0) {
                    optionsHTML = `<div class="options-grid">` + 
                        item.options.map(opt => `<div class="option-item">${opt}</div>`).join('') + 
                        `</div>`;
                }

                let figureHTML = item.figure ? item.figure : '';

                card.innerHTML = `
                    <div class="q-number">${globalQuestionCounter}</div>
                    <div class="question-text">${item.q}</div>
                    ${figureHTML}
                    ${optionsHTML}
                    ${generateWorkspace()}
                    <button class="btn-toggle" onclick="toggleSolution(this)">Show Solution</button>
                    <div class="solution-box">${item.a}</div>
                `;
                appContainer.appendChild(card);
                globalQuestionCounter++;
            });
        });

        function toggleSolution(btn) {
            const solutionBox = btn.nextElementSibling;
            if (solutionBox.style.display === "block") {
                solutionBox.style.display = "none";
                btn.textContent = "Show Solution";
            } else {
                solutionBox.style.display = "block";
                btn.textContent = "Hide Solution";
            }
        }

                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
